[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant-opencog"
version = "0.1.0"
description = "OpenCog integration for assistant-ui with bidirectional Atomese translation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenCog Community", email = "opencog@googlegroups.com" }
]
keywords = [
    "opencog",
    "atomese",
    "knowledge-representation",
    "natural-language",
    "ai",
    "chatbot",
    "assistant-ui"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "asyncio-mqtt>=0.13.0",
    "websockets>=11.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
assistant-stream = [
    "assistant-stream>=0.2.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/opencog/cogsist-ui"
Repository = "https://github.com/opencog/cogsist-ui"
Documentation = "https://github.com/opencog/cogsist-ui/tree/main/python/assistant-opencog"
Issues = "https://github.com/opencog/cogsist-ui/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests", 
    "/README.md"
]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_opencog"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"